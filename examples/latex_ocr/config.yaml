# LaTeX OCR with AnyModal
# Dataset: LaTeX_OCR | Vision: SigLip | LLM: Llama 3.2-1B + LoRA

encoder:
  model_name: "google/siglip-so400m-patch14-384"
  hidden_layer_index: -2
  freeze: true

projector:
  type: "mlp"
  kwargs:
    num_layers: 2

language_model:
  model_name: "meta-llama/Llama-3.2-1B"
  use_peft: true
  peft_kwargs:
    r: 64
    lora_alpha: 128
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    lora_dropout: 0.05
  torch_dtype: "auto"

input_start_token: "<|input_start|>"
input_end_token: "<|input_end|>"
prompt_text: "The latex expression of the equation in the image is:"

data:
  dataset_name: "unsloth/LaTeX_OCR"
  dataset_config: "human_handwrite_print"
  image_field: "image"
  text_field: "text"
  train_split: "train"
  eval_split: "test"
  subset_ratio: 0.2

training:
  output_dir: "./output/latex_ocr"
  num_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  learning_rate: 3.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  fp16: true
  logging_steps: 10
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2
  seed: 42
  report_to: "none"
